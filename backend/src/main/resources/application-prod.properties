# BX-CONNECT - Profil production
# Secrets obligatoires : aucune valeur par defaut volontairement.

bx.production=${BX_PRODUCTION:true}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

jwt.secret=${JWT_SECRET}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

logging.level.root=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.pattern.level=%5p [requestId=%X{requestId:-}]

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
frontend.url=${FRONTEND_URL}

paypal.client-id=${PAYPAL_CLIENT_ID}
paypal.client-secret=${PAYPAL_CLIENT_SECRET}
paypal.mode=${PAYPAL_MODE}
paypal.return-url=${PAYPAL_RETURN_URL}
paypal.cancel-url=${PAYPAL_CANCEL_URL}

stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
stripe.success-url=${STRIPE_SUCCESS_URL}
stripe.cancel-url=${STRIPE_CANCEL_URL}

app.password-reset.email-enabled=${PASSWORD_RESET_EMAIL_ENABLED:true}
app.password-reset.token-ttl=${PASSWORD_RESET_TOKEN_TTL:PT15M}
app.password-reset.frontend-url=${PASSWORD_RESET_FRONTEND_URL}
app.password-reset.from-address=${PASSWORD_RESET_FROM_ADDRESS}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
