# ── Serveur ────────────────────────────────────────────────
server.port=8080
 
# ── MySQL ──────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/bx_connect?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=[REDACTED_FROM_HISTORY]
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
 
# ── JPA / Hibernate ────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
 
# ── JWT ────────────────────────────────────────────────────
jwt.secret=[REDACTED_FROM_HISTORY]
jwt.expiration=86400000
 
# ── CORS ───────────────────────────────────────────────────
frontend.url=http://localhost:5173