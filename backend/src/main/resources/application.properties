# BX-CONNECT - Configuration commune
# Par defaut, le profil dev est charge pour garder le TFE utilisable en local.
# En production, lancer avec SPRING_PROFILES_ACTIVE=prod et fournir les secrets
# obligatoires via variables d'environnement.

spring.profiles.default=dev

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/bxconnect_mvp1?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

frontend.url=http://localhost:5173

bx.super-admin.email=${BX_SUPER_ADMIN_EMAIL:superadmin@bx-connect.local}
bx.super-admin.password=${BX_SUPER_ADMIN_PASSWORD:}
bx.super-admin.prenom=${BX_SUPER_ADMIN_PRENOM:System}
bx.super-admin.nom=${BX_SUPER_ADMIN_NOM:SuperAdmin}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true

info.app.name=Bx-Connect API
info.app.version=alpha
info.app.description=API backend de la plateforme Bx-Connect

paypal.client-id=${PAYPAL_CLIENT_ID}
paypal.client-secret=${PAYPAL_CLIENT_SECRET}
paypal.mode=${PAYPAL_MODE}
paypal.return-url=http://localhost:8080/api/paiements/confirmer
paypal.cancel-url=http://localhost:8080/api/paiements/annuler

stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
stripe.success-url=http://localhost:5173/paiement/succes
stripe.cancel-url=http://localhost:5173/paiement/annule
