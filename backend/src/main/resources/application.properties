# ─────────────────────────────────────────────────────────────
# BX-CONNECT — CONFIGURATION PRINCIPALE
# ─────────────────────────────────────────────────────────────

# ── Serveur ──────────────────────────────────────────────────
server.port=8080

# ── MySQL ────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/bxconnect_mvp1?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ── JWT ──────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:[REDACTED_FROM_HISTORY]}
jwt.expiration=86400000

# ── CORS ─────────────────────────────────────────────────────
frontend.url=http://localhost:5173

# ── Swagger / OpenAPI ────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true

# ── Logs ─────────────────────────────────────────────────────
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=ERROR

# ── Encodage ─────────────────────────────────────────────────
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ── Upload fichiers ──────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── PayPal ───────────────────────────────────────────────────
paypal.client-id=${PAYPAL_CLIENT_ID:[REDACTED_FROM_HISTORY]}

paypal.client-secret=${PAYPAL_CLIENT_SECRET:[REDACTED_FROM_HISTORY]}

paypal.mode=sandbox
paypal.return-url=http://localhost:8080/api/paiements/confirmer
paypal.cancel-url=http://localhost:8080/api/paiements/annuler

# ── Stripe ───────────────────────────────────────────────────
# Clés temporaires pour développement local
stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_temp}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:pk_test_temp}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_temp}

# URLs frontend après paiement
stripe.success-url=http://localhost:5173/paiement/succes
stripe.cancel-url=http://localhost:5173/paiement/annule

# ── Mail (optionnel futur) ──────────────────────────────────
spring.mail.host=localhost
spring.mail.port=1025

# ── Timezone ─────────────────────────────────────────────────
spring.jackson.time-zone=Europe/Brussels
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Brussels