# ── Serveur ────────────────────────────────────────────────────────────────────
server.port=8080

# ── MySQL ──────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/bxconnect_mvp1?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ────────────────────────────────────────────────────────────
# ⚠️ Utiliser 'validate' en production, 'update' uniquement en développement
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── JWT ────────────────────────────────────────────────────────────────────────
# ⚠️ En production : définir JWT_SECRET comme variable d'environnement
jwt.secret=${JWT_SECRET:[REDACTED_FROM_HISTORY]}
jwt.expiration=86400000

# ── CORS ───────────────────────────────────────────────────────────────────────
frontend.url=http://localhost:5173

# ── Swagger / OpenAPI ──────────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true

# ── PayPal Sandbox ─────────────────────────────────────────────────────────────
# ⚠️ En production : définir PAYPAL_CLIENT_ID et PAYPAL_CLIENT_SECRET
#    comme variables d'environnement (ne jamais committer les vraies valeurs)
paypal.client-id=${PAYPAL_CLIENT_ID:[REDACTED_FROM_HISTORY]}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:[REDACTED_FROM_HISTORY]}
paypal.mode=sandbox
paypal.return-url=http://localhost:8080/api/paiements/confirmer
paypal.cancel-url=http://localhost:8080/api/paiements/annuler