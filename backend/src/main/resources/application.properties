# BX-CONNECT - Configuration locale
# Lancer avec variables d environnement - voir README-LANCEMENT.md

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/bxconnect_mvp1?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

jwt.secret=${JWT_SECRET:bxconnect_local_secret_key_very_long_256_bits_ok_for_dev}
jwt.expiration=86400000

frontend.url=http://localhost:5173

bx.super-admin.email=${BX_SUPER_ADMIN_EMAIL:superadmin@bx-connect.local}
bx.super-admin.password=${BX_SUPER_ADMIN_PASSWORD:ChangeMe123!}
bx.super-admin.prenom=${BX_SUPER_ADMIN_PRENOM:System}
bx.super-admin.nom=${BX_SUPER_ADMIN_NOM:SuperAdmin}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true

paypal.client-id=${PAYPAL_CLIENT_ID:demo}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:demo}
paypal.mode=sandbox
paypal.return-url=http://localhost:8080/api/paiements/confirmer
paypal.cancel-url=http://localhost:8080/api/paiements/annuler

stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_demo}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:pk_test_demo}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_demo}
stripe.success-url=http://localhost:5173/paiement/succes
stripe.cancel-url=http://localhost:5173/paiement/annule
