# BX-CONNECT - Profil local/dev pour TFE

jwt.secret=${JWT_SECRET:bxconnect_local_secret_key_very_long_256_bits_ok_for_dev}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

paypal.client-id=${PAYPAL_CLIENT_ID:demo}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:demo}
paypal.mode=${PAYPAL_MODE:sandbox}

stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_demo}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:pk_test_demo}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_demo}
