name: bx-connect

services:
  mysql:
    image: mysql:9.6
    container_name: bx-connect-mysql
    restart: unless-stopped

    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bxconnect_mvp1}
      MYSQL_USER: ${DB_USERNAME:-bxconnect}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    volumes:
      - bx_connect_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  bx_connect_mysql_data:
